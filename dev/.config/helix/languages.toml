[[language]]
name = "go"
scope = "source.go"
injection-regex = "go"
file-types = ["go"]
roots = ["go.work", "go.mod"]
auto-format = true
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
formatter = ["gofmt"]
language-servers = [ "gopls", "golangci-lint-lsp", "codebook" ]
# TODO: gopls needs utf-8 offsets?
indent = { tab-width = 2, unit = "\t" }

[language-server.golangci-lint-lsp]
command = "golangci-lint-langserver"

[language-server.golangci-lint-lsp.config]
command = ["golangci-lint", "run", "--output.json.path=stdout", "--show-stats=false", "--issues-exit-code=1"]

[language-server.gopls]
command = "gopls"

[language-server.gopls.config]
"local" = "goimports"
"staticcheck" = true
"verboseOutput" = true
completeUnimported = true
"semanticTokens" = true
usePlaceholders = true

[language-server.gopls.config.analyses]
"nilness" = true
unusedparams = true
unusedwrite = true
useany = true

[language-server.gopls.config.hints]
assignVariableTypes = true
compositeLiteralFields = true
constantValues = true
functionTypeParameters = true
parameterNames = true
rangeVariableTypes = true
"assignVariableType" = true
"compositeLiteralTypes" = true

[[language]]
name = "rust"
formatter = { command = "rustfmt" }

[language-server.codebook]
command = "codebook-lsp"
args = ["serve"]


[[language]]
name = "markdown"
language-servers = ["codebook"]


# --- Ada ---------------------------------------------------------------------
# Formatting is done by ALS over LSP (it wraps GNATformat), so no external
# formatter command is needed.
#
# Debugging goes through cppdbg (MIEngine driving gdb over MI) rather than gdb's
# own DAP interpreter. gdb-dap cannot give the debuggee a terminal of its own:
# grep its implementation in /usr/share/gdb/python/gdb/dap and runInTerminal
# appears nowhere, and `launch` accepts no console option, so the program
# inherits gdb's stdio — which under a TUI editor is Helix's own terminal.
# Anything that reads input is unusable. cppdbg asks Helix for a terminal via a
# runInTerminal request, which is why [editor.terminal] in config.toml is a hard
# requirement here. Ada type and array printing is unaffected: both routes end
# at the same gdb, so aggregates and `V(2)` indexing still work.
#
# miDebuggerPath is the system gdb deliberately — same 17.2 as the Alire
# toolchain's, but built with Python, which the Alire one lacks and
# -enable-pretty-printing needs.

[[language]]
name = "ada"
auto-format = true
indent = { tab-width = 3, unit = "   " }
language-servers = ["ada-language-server"]

# The adapter ships inside the VS Code cpp debug extension; the path carries
# that extension's version and will break when it updates.
[language.debugger]
name = "cppdbg"
transport = "stdio"
command = "/home/vir/.vscode-oss/extensions/kylinideteam.cppdebug-0.4.0-linux-x64/dist/debugAdapter/OpenDebugAD7"

# cwd is mandatory — cppdbg rejects a launch with "property 'cwd' is missing or
# empty" — but Helix substitutes only the {N} completion slots and has no
# workspace-root variable. "." works because Helix starts the adapter in the
# project directory, so MIEngine resolves it there. Do not drop it.
#
# setupCommands mirror the zed-cppdbg extension so both editors debug alike.
# "set multiple-symbols cancel" stops gdb interrogating you about which
# instantiation you meant, which Ada generics produce in quantity.
[[language.debugger.templates]]
name = "binary"
request = "launch"
completion = [{ name = "binary", completion = "filename" }]
args = { type = "cppdbg", MIMode = "gdb", miDebuggerPath = "/usr/bin/gdb", program = "{0}", cwd = ".", externalConsole = false, setupCommands = [{ text = "-enable-pretty-printing", ignoreFailures = true }, { text = "set multiple-symbols cancel", ignoreFailures = false }] }

# stopAtEntry breaks on main, which for Ada is the C wrapper that runs adainit
# first — so this lands before elaboration, unlike gdb-dap's
# stopAtBeginningOfMainSubprogram, which stopped at _ada_<main> itself.
[[language.debugger.templates]]
name = "binary (stop at entry)"
request = "launch"
completion = [{ name = "binary", completion = "filename" }]
args = { type = "cppdbg", MIMode = "gdb", miDebuggerPath = "/usr/bin/gdb", program = "{0}", cwd = ".", externalConsole = false, stopAtEntry = true, setupCommands = [{ text = "-enable-pretty-printing", ignoreFailures = true }, { text = "set multiple-symbols cancel", ignoreFailures = false }] }

# cppdbg needs the binary as well as the pid, unlike gdb-dap which took pid alone.
[[language.debugger.templates]]
name = "attach"
request = "attach"
completion = [{ name = "binary", completion = "filename" }, { name = "pid" }]
args = { type = "cppdbg", MIMode = "gdb", miDebuggerPath = "/usr/bin/gdb", program = "{0}", cwd = ".", processId = "{1}", setupCommands = [{ text = "-enable-pretty-printing", ignoreFailures = true }, { text = "set multiple-symbols cancel", ignoreFailures = false }] }

[language-server.ada-language-server]
command = "ada_language_server"
# command = "alr"
# args = ["exec", "--", "ada_language_server"]

# Same server handles .gpr files.
[[language]]
name = "gpr"
language-servers = ["ada-gpr-language-server"]

[language-server.ada-gpr-language-server]
command = "ada_language_server"
args = ["--language-gpr"]
# command = "alr"
# args = ["exec", "--", "ada_language_server", "--language-gpr"]